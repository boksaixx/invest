# 자동 수집 에이전트
# - 한국 장중(평일 09:00~15:30 KST) 15분 간격으로 시세/뉴스 수집·분석 후 저장소에 저장
# - 개장 전 브리핑(08:30 KST), 장 마감 요약(16:10 KST)
# - 밤 11시~아침 7시(KST)는 호출 없음, 주말은 일요일 저녁 1회만 (API 비용을 월 $10 이내로 유지하기 위함)
# - 자동수집 요약은 저렴한 모델(claude-haiku-4-5, lib/claude.ts의 SUMMARY_MODEL)을 사용
# - 수동 실행: Actions 탭 → "Trading Agent" → Run workflow 버튼
name: Trading Agent

on:
  schedule:
    - cron: "*/15 0-5 * * 1-5"   # KST 09:00~14:45 장중 15분 간격 (UTC 기준)
    - cron: "0,15,30 6 * * 1-5"  # KST 15:00~15:30 장 마감 직전 15분 간격
    - cron: "30 23 * * 0-4"      # KST 08:30 개장 전 브리핑
    - cron: "10 7 * * 1-5"       # KST 16:10 장 마감 요약
    - cron: "0 11 * * 0"         # KST(일) 20:00 주말 1회 점검 (+ 주간 백테스트 갱신)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 추적 종목이 늘었는데 히스토리가 비어 있으면 그 종목은 백테스트·국면통계·상승률이
      # 전부 계산되지 않는다. 예전에는 주간 크론에서만 백필해서 최대 일주일을 비운 채 돌았다.
      # 매 실행마다 먼저 확인하고, 빠진 게 있으면 바로 채운다.
      - name: 히스토리 누락 검사
        id: histcheck
        run: |
          if npx tsx scripts/check-history.ts; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 5개년 과거 데이터 백필 (누락 시 즉시 + 매주 일요일 점검)
        if: ${{ steps.histcheck.outputs.missing == 'true' || github.event.schedule == '0 11 * * 0' }}
        run: npm run backfill

      - name: 백테스트 통계 갱신 (히스토리 새로 채웠거나 최초 1회 + 매주 일요일)
        if: ${{ steps.histcheck.outputs.missing == 'true' || hashFiles('data/backtest.json') == '' || github.event.schedule == '0 11 * * 0' }}
        run: npm run backtest

      # 국면별 통계·상승률 테이블도 히스토리가 늘면 같이 다시 만들어야 최신 종목이 반영된다
      - name: 국면 통계 재생성 (히스토리 변경 시 + 매주 일요일)
        if: ${{ steps.histcheck.outputs.missing == 'true' || github.event.schedule == '0 11 * * 0' }}
        run: npx tsx scripts/build-scenarios.ts || echo "국면 통계 재생성 실패 — 기존 파일 유지"

      - name: 상승률·도달확률 테이블 재생성 (매주 일요일)
        if: ${{ github.event.schedule == '0 11 * * 0' }}
        run: |
          npx tsx scripts/validate-touch.ts || echo "도달확률 갱신 실패 — 기존 파일 유지"
          npx tsx scripts/validate-probability.ts || echo "상승률 갱신 실패 — 기존 파일 유지"

      - name: 시세·뉴스 수집 및 AI 분석
        run: npm run collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: 데이터 커밋
        run: |
          git config user.name "trading-agent[bot]"
          git config user.email "trading-agent@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
